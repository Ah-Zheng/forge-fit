<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12182c" stop-opacity="1" />
      <stop offset="100%" stop-color="#080A10" stop-opacity="1" />
    </radialGradient>
    
    <!-- Neon Blue to Cyan Linear Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F80ED" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- PWA Maskable Base Background -->
  <rect width="512" height="512" fill="url(#bgGlow)" rx="112" />

  <!-- Dumbbell Icon Group with Glow -->
  <g transform="translate(0, 0)" filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="140" y="236" width="232" height="40" rx="10" fill="url(#neonGradient)" opacity="0.9" />

    <!-- Left Collar (Inner stop) -->
    <rect x="190" y="216" width="16" height="80" rx="6" fill="#00F0FF" />
    
    <!-- Left Small Plate -->
    <rect x="156" y="176" width="26" height="160" rx="10" fill="url(#neonGradient)" />
    
    <!-- Left Big Plate -->
    <rect x="110" y="136" width="38" height="240" rx="16" fill="url(#neonGradient)" />

    <!-- Right Collar (Inner stop) -->
    <rect x="306" y="216" width="16" height="80" rx="6" fill="#00F0FF" />

    <!-- Right Small Plate -->
    <rect x="330" y="176" width="26" height="160" rx="10" fill="url(#neonGradient)" />
    
    <!-- Right Big Plate -->
    <rect x="364" y="136" width="38" height="240" rx="16" fill="url(#neonGradient)" />
  </g>

  <!-- Sleek Accent Lines -->
  <circle cx="256" cy="256" r="236" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.1" stroke-dasharray="10 15" />
  <circle cx="256" cy="256" r="224" stroke="#2F80ED" stroke-width="1" fill="none" opacity="0.15" />
</svg>
