name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # 💡 如果您的主分支名稱是 master，請將其修改為 master
  workflow_dispatch: # 💡 允許手動觸發部署

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install pnpm ⚙️
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies 📦
        run: pnpm install --no-frozen-lockfile

      - name: Build Project 🏗️
        run: pnpm build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/web/dist  # 💡 Vite 打包輸出的網頁靜態資料夾
          branch: gh-pages  # 💡 部署至 GitHub Pages 的 gh-pages 分支
